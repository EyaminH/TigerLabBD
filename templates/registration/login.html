{% extends 'base.html' %}

{% block title %}Login — TigerLabBD{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="text-center mb-4 animate-on-scroll">
            <div class="mb-3">
                <i class="bi bi-shield-lock-fill display-4 text-gradient"></i>
            </div>
            <h2 class="fw-bold">Welcome Back</h2>
            <p style="color: var(--text-muted);">Access your account to continue.</p>
        </div>

        <div class="card glow-border p-4 animate-on-scroll">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="p-3 rounded-3 mb-4" style="background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.25);">
                            <i class="bi bi-exclamation-circle-fill me-2" style="color: var(--danger);"></i>
                            <span class="small">Incorrect username or password. Please try again.</span>
                        </div>
                    {% endif %}

                    <div class="mb-4">
                        <label for="id_username" class="form-label fw-bold small">
                            <i class="bi bi-person me-1" style="color: var(--accent-primary);"></i>Username or Email
                        </label>
                        <input type="text" name="username" autofocus maxlength="150" required id="id_username" 
                               class="form-control py-2" placeholder="Enter username or email">
                    </div>
                    
                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-bold small">
                            <i class="bi bi-lock me-1" style="color: var(--accent-primary);"></i>Password
                        </label>
                        <input type="password" name="password" required id="id_password" 
                               class="form-control py-2" placeholder="Enter password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 py-2 fw-bold">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>

                <div class="mt-4 pt-4 text-center" style="border-top: 1px solid var(--border-color);">
                    <p class="small mb-0" style="color: var(--text-muted);">
                        Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
